# Personal build with Indonesian: builds the Indonesian speech pack, puts its hash into the app's catalog, then builds the
# debug APK (com.olerast.suflyor.debug, installs next to the official app). Run it by hand: Actions → this workflow →
# Run workflow. Download "suflyor-indonesia" from the finished run: the APK and suflyor-speech-id-1.zip.
name: Build with Indonesian

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Downloads the model from Hugging Face, prints the SHA-256 of its files, writes the zip and adds the Indonesian
      # entry to SpeechPackCatalog.kt, so the app built below accepts exactly this zip.
      - name: Build the Indonesian speech pack
        run: python3 tools/speech-packs/build.py packs --only id --allow-unpinned

      - name: Build the app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # The tests run for information only: a failure here still gives the APK, and the report is kept.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suflyor-indonesia
          path: |
            app/build/outputs/apk/debug/*.apk
            packs/suflyor-speech-id-1.zip
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
